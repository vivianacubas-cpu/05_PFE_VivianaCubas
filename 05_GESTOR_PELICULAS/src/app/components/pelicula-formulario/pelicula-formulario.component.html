<section class="formulario">
  <h2>Nuevo Película</h2>

  <input
    type="text"
    placeholder="Nombre del película"
    [(ngModel)]="nuevoPelicula.nombre">

  <select [(ngModel)]="nuevoPelicula.categoria">
    <option value="Salud">Salud</option>
    <option value="Estudio">Estudio</option>
    <option value="Trabajo">Trabajo</option>
    <option value="Personal">Personal</option>
  </select>

  <button
    [disabled]="!nuevoPelicula.nombre"
    (click)="guardarPelicula()">
    + Agregar Película
  </button>
</section>
